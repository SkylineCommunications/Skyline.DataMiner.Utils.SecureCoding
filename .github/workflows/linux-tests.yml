name: Linux Tests

# Runs every net8.0 test project on real Linux using the same runner as local tests.
# Windows coverage is provided by the main CICD workflow.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  linux-tests:
    name: All Linux tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run all tests and verify Linux coverage
        shell: pwsh
        run: ./scripts/Test-Linux.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux-net8.0
          path: TestResults/linux/*.trx
          if-no-files-found: error
