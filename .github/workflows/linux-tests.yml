name: Linux Tests

# Runs the test suite on Linux so that tests marked with [OSCondition(OperatingSystems.Linux)]
# (real Linux path construction/normalization) are executed. Windows coverage is provided by the
# main CICD workflow.
on:
  push:
    branches: '**'
  pull_request:
  workflow_dispatch:

jobs:
  linux-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SecureCoding.Test/SecureCoding.Test.csproj -p:TargetFramework=net8.0

      - name: Test (net8.0)
        run: dotnet test SecureCoding.Test/SecureCoding.Test.csproj -f net8.0 --no-restore --logger "trx;LogFileName=linux-net8.0.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux-net8.0
          path: TestResults/*.trx
