name: Linux Tests

# Runs SecureAssembly validation, loading and Authenticode hardening on real Linux,
# alongside the remaining suite (including Linux SecurePath tests).
# Windows coverage is provided by the main CICD workflow.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  linux-tests:
    name: Linux tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: secure-assembly
            filter: FullyQualifiedName~SecureCoding.Test.SecureReflection.
          - suite: remaining
            filter: FullyQualifiedName!~SecureCoding.Test.SecureReflection.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SecureCoding.Test/SecureCoding.Test.csproj

      - name: Test (net8.0)
        env:
          TEST_FILTER: ${{ matrix.filter }}
        run: >-
          dotnet test SecureCoding.Test/SecureCoding.Test.csproj
          -f net8.0 --no-restore
          --filter "$TEST_FILTER"
          --logger "trx;LogFileName=linux-net8.0.trx"
          --results-directory TestResults
          -- RunConfiguration.TreatNoTestsAsError=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux-net8.0-${{ matrix.suite }}
          path: TestResults/*.trx
